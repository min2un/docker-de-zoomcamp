[project]
name = "pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sugarcanolic", email = "162794810+min2un@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.1",
    "psycopg2>=2.9.13",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.1",
    "sqlalchemy>=2.1.8",
    "tqdm>=4.70.1",
]

[project.scripts]
pipeline = "pipeline:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pgcli>=4.7.1",
]
